<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Clinic System</title>

    <!-- Favicon link -->
    <link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon" />

    <!-- Stylesheets -->
    <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}" />

    <!-- Utility & Component JavaScript Files -->
    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/util.js}" defer></script>
    <script th:src="@{/js/components/header.js}" defer></script>
    <script th:src="@{/js/components/footer.js}" defer></script>

    <!-- Services and Main Logic -->
    <script type="module" th:src="@{/js/services/adminDashboard.js}" defer></script>
</head>
<body>

    <div class="container">
        <div class="wrapper">

            <!-- Dynamic Header placeholder -->
            <div id="header"></div>

            <!-- Main Content Area -->
            <main class="main-content">
                <h2>Admin Dashboard</h2>

                <!-- Control Panel / Actions -->
                <div class="admin-actions">
                    <button id="addDocBtn" class="dashboard-btn">Add Doctor</button>
                </div>

                <!-- Doctors / Management Table -->
                <table id="adminTable" class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email / Specialty</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                        <!-- Динамічно заповнюється скриптами -->
                    </tbody>
                </table>
            </main>

            <!-- Dynamic Footer placeholder -->
            <div id="footer"></div>

        </div>
    </div>

    <!-- Reusable Modal Markup -->
    <div id="modal" class="modal hidden" style="display: none !important;">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

</body>
</html>
