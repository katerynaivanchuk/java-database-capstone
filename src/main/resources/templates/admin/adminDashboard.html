<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Clinic System</title>

    <link rel="icon" href="https://fav.farm/🏥">

    <!-- Стилі -->
    <link rel="stylesheet" th:href="@{/assets/css/index.css}">
    <!-- Розкоментуй, якщо файл static/assets/css/adminDashboard.css існує -->
    <!-- <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}"> -->

    <!-- Компоненти -->
    <script th:src="@{/js/components/header.js}" defer></script>
    <script th:src="@{/js/components/footer.js}" defer></script>

    <!-- Основна логіка дашборду -->
    <script type="module" th:src="@{/js/adminDashboard.js}"></script>
</head>
<body>
    <div class="wrapper">
        <div id="header"></div>

        <main class="main-content">
            <h2>Admin Dashboard</h2>

            <input type="text" id="searchBar" class="searchBar" placeholder="Search doctors by name" />

            <div class="filter-wrapper">
                <select class="filter-select" id="filterTime">
                    <option value="">All Times</option>
                    <option value="AM">AM</option>
                    <option value="PM">PM</option>
                </select>

                <select class="filter-select" id="filterSpecialty">
                    <option value="">All Specialties</option>
                    <option value="Cardiology">Cardiology</option>
                    <option value="Dermatology">Dermatology</option>
                    <option value="Neurology">Neurology</option>
                    <option value="Pediatrics">Pediatrics</option>
                    <option value="General">General</option>
                </select>
            </div>

            <div id="content"></div>

            <table id="adminTable" class="admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email / Specialty</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody">
                    <!-- Заповнюється скриптом -->
                </tbody>
            </table>
        </main>

        <div id="footer"></div>
    </div>

    <!-- Модальне вікно (керується класом hidden) -->
    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <button id="closeModal" class="close-btn">&times;</button>
            <div id="modal-body"></div>
        </div>
    </div>
</body>
</html>
