<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard</title>
    <link rel="icon" href="https://fav.farm/🏥">

    <link rel="stylesheet" href="/assets/css/index.css">
    <link rel="stylesheet" href="/assets/css/doctorDashboard.css">

    <script src="/js/components/header.js" defer></script>
    <script src="/js/components/footer.js" defer></script>
    <script type="module" src="/js/doctorDashboard.js"></script>
</head>
<body>
    <div class="wrapper">
        <div id="header"></div>

        <main class="main-content">
            <input type="text" id="searchBar" placeholder="Search patients..." />

            <div class="filter-section">
                <button id="todayAppointmentsBtn">Today's Appointments</button>
                <input type="date" id="appointmentDateFilter" />
            </div>

            <table id="patientTable">
                <thead>
                    <tr>
                        <th>Patient ID</th>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Prescription</th>
                    </tr>
                </thead>
                <tbody id="patientTableBody"></tbody>
            </table>
        </main>

        <div id="footer"></div>
    </div>
</body>
</html>
